<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futures Radar · AI 期货市场分析</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="dot"></span>
    <h1>Futures Radar</h1>
    <span class="sub">能源 · 金属 · 农产品 · 金融期货</span>
    <span id="demoBadge" class="demo" hidden>演示数据 · 虚构</span>
  </div>
  <nav class="tabs" aria-label="视图">
    <a href="#" data-view="overview">总览</a>
    <a href="#instruments" data-view="instruments">品种</a>
    <a href="#events" data-view="events">事件</a>
    <a href="#calibration" data-view="calibration">模型校准</a>
  </nav>
  <div class="filters">
    <div id="domainChips" class="chips"></div>
    <span id="evFilters" class="evf" hidden>
      <label class="range">严重性 ≥ <b id="minVal">0</b>
        <input id="minSev" type="range" min="0" max="80" step="10" value="0">
      </label>
      <label class="toggle"><input id="watch" type="checkbox" checked> 含观察级</label>
    </span>
  </div>
</header>

<main class="layout">
  <aside id="list" class="list" aria-label="事件列表"></aside>
  <section id="detail" class="detail" aria-live="polite">
    <div class="empty">加载中…</div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="tools.js" defer></script>
<script src="hourly.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
