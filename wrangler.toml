name = "news-radar"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "a97d40bfd3c4912c2a8fcddba028dbce"
workers_dev = false

[[routes]]
pattern = "futures-radar.freedom8964.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
crons = ["*/5 * * * *"]   # 每 5 分钟更新报价和 5 分钟K线；新闻、分析、校准等仍按 15 分钟/每小时运行

[[d1_databases]]
binding = "DB"
database_name = "news-radar"
database_id = "ed38a33f-376e-4dd9-9e12-5a5a3d389d04"

[[vectorize]]
binding = "VECTORIZE"
index_name = "news-radar-articles"

[ai]
binding = "AI"

[[queues.producers]]
binding = "QUEUE"
queue = "news-radar-jobs"

[[queues.consumers]]
queue = "news-radar-jobs"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[vars]
EMBED_MODEL = "@cf/baai/bge-m3"          # 多语言，1024 维，中英文混合聚类
AI_GATEWAY_ID = "default"                # Workers AI 经 AI Gateway 调用，可在控制台查看日志；留空则直连
WORKERSAI_DAILY_REQUESTS = "100"           # 每天最多 100 次优先走 Qwen；其余模型只作故障/额度回退
GROQ_DAILY_REQUESTS = "1000"
OPENROUTER_DAILY_REQUESTS = "45"           # 免费 50 次留 5 次余量
GEMINI_DAILY_REQUESTS = "400"              # gemini-3.1-flash-lite 免费档约 500 次/天（以 AI Studio 显示为准），留余量；太平洋时间零点重置
# 分诊量最大，先走 Workers AI Qwen 3 30B；Gemini 每分钟只有 10 次，放分诊链末尾，主要用在提示长、次数少的分析、解读和情景上：
CHAIN_TRIAGE = "workersai,glm,groq,ollama,opencode,openrouter,gemini"
CHAIN_ANALYSIS = "workersai,gemini,glm,ollama,opencode,openrouter"
CHAIN_ANALYSIS_IMPORTANT = "workersai,gemini,glm,ollama,opencode,openrouter"
CHAIN_BRIEF = "glm,gemini,ollama,groq,opencode,openrouter,workersai"      # 美东 17:30 生成；Workers AI 额度白天已被分诊用完，放最后
CHAIN_OUTLOOK = "groq,gemini,glm,ollama,opencode,openrouter,workersai"   # 每小时方向判断与情景（所有开盘品种合并一次请求，每天约 23 次）
# 各家模型可单独覆盖：WORKERSAI_MODEL / GEMINI_MODEL / GROQ_MODEL / GLM_MODEL / OLLAMA_MODEL / OPENCODE_MODEL / OPENROUTER_MODEL
WORKERSAI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
GEMINI_MODEL = "gemini-3.1-flash-lite"
GROQ_MODEL = "openai/gpt-oss-120b"   # Llama 3.3 70B 已于 2026-08-16 关停
GLM_MODEL = "glm-4.7-flash"
OPENCODE_MODEL = "deepseek-v4.1-flash-free"
OPENROUTER_MODEL = "openrouter/free"
# Claude 模型：TRIAGE_MODEL（默认 claude-haiku-5-5）/ ANALYSIS_MODEL（默认 claude-sonnet-5-5）
OLLAMA_MODEL = "deepseek-v4-flash"
LLM_TIMEOUT_MS = "90000"
CLUSTER_THRESHOLD = "0.78"               # 余弦相似度阈值，越高越不容易合并
CLUSTER_WINDOW_HOURS = "72"
MAX_ITEMS_PER_FEED = "30"
MAX_ARTICLE_AGE_HOURS = "72"
MIN_TRIAGE_SEVERITY = "2"                # 分诊粗分低于此值不做深度分析（省钱）
DEEP_MODEL_MIN_SEVERITY = "4"            # 粗分 ≥ 此值走 CHAIN_ANALYSIS_IMPORTANT（有 Anthropic key 时先用 Sonnet）
DAILY_BUDGET_USD = "2"                   # 付费模型（Claude）每日花费上限，达到后路由自动只用免费模型
MAX_ANALYSES_PER_RUN = "5"               # 每次 cron 最多深度分析几个事件
ANALYSIS_COOLDOWN_MIN = "30"             # 同一事件两次分析的最短间隔
REANALYZE_MIN_NEW = "3"                  # 已分析事件新增报道 ≥ max(此值, 30%) 才重新分析
REANALYZE_MAX_HOURS = "6"                # ……或距上次分析超过此小时数且有新报道
MAX_SOURCES = "15"                       # 每次深度分析最多带几篇报道
MAX_SOURCE_CHARS = "2000"                # 每篇报道最多带多少字符正文
CONTENT_RETENTION_DAYS = "30"            # 超过此天数的文章正文被清除（保留标题、摘要、链接）
MARKET_PROVIDER = "yahoo"                # yahoo（免key，非官方）| twelvedata（需 TWELVEDATA_API_KEY）；失败时自动切换
MARKET_PRE_HOURS = "2"                   # 市场反应锚点 = 首篇报道时间往前推 N 小时

# 密钥（不要写在这里，运行 ./scripts/set-secrets.sh 逐个录入）：
#   ADMIN_TOKEN          管理接口令牌（必需）
#   ZHIPU_API_KEY        智谱
#   OLLAMA_API_KEY       Ollama Cloud
#   GROQ_API_KEY         Groq
#   OPENCODE_API_KEY     OpenCode Zen
#   OPENROUTER_API_KEY   OpenRouter
#   GEMINI_API_KEY       Google Gemini（免费模型，每日最多 10 次）
#   ANTHROPIC_API_KEY    可选，Claude（付费）
#   TWELVEDATA_API_KEY   可选，行情备用源
# Workers AI 通过 [ai] 绑定调用，不需要 key。
